services:
  - type: web
    name: maktab-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maktab-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://frontend-three-amber-19.vercel.app"]'
      - key: ENVIRONMENT
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://frontend-three-amber-19.vercel.app

databases:
  - name: maktab-postgres
    plan: free
    databaseName: school_assistant
    user: school
